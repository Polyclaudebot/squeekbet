server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header Cache-Control "no-cache" always; # all files revalidate, so users never run a stale app.js/abi.js

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://api.squeekchain.com https://media.squeekchain.com https://studio.x.com https://ethereum-sepolia-rpc.publicnode.com; frame-src https://studio.x.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /config.js { add_header Cache-Control "no-cache" always; add_header Content-Security-Policy "default-src 'none'" always; add_header X-Content-Type-Options "nosniff" always; }
    location / { try_files $uri $uri/ =404; }
}
