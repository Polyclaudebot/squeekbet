# Public front: Caddy terminates HTTPS (Let's Encrypt) and proxies to the static nginx container.
services:
  web:
    image: nginx:alpine
    container_name: squeekbet-web
    restart: unless-stopped
    volumes:
      - ../web:/usr/share/nginx/html:ro
      - ../build/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8090:80"   # SSH tunnel access stays available
  caddy:
    image: caddy:2.8-alpine
    container_name: squeekbet-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on: [web]
